server:
  port: 8081

spring:
  application:
    name: wallet-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/wallet_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Liverpool040}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

# --- Sécurité JWT (utilisateurs finaux) ---
jwt:
  secret: ${JWT_SECRET:CHANGE_MOI_EN_PROD_CLE_SECRETE_TRES_LONGUE_ET_ALEATOIRE_256_BITS}
  expiration: 86400000 # 24h en millisecondes

# --- Sécurité inter-microservices (appels venant de l'app Prestation) ---
internal:
  api-key: ${INTERNAL_API_KEY:cle-secrete-a-changer-en-prod-partagee-avec-service-prestation}

# --- Documentation API ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.dakartechwallet.walletbackend: DEBUG
    org.hibernate.SQL: DEBUG